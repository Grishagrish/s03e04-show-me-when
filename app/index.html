<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sched-prod · incidents</title><meta name="build" content="BUILD_SHA" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <h1>incidents</h1>
      <p class="sub">sched-prod · tonight</p>
    </header>
    <main data-testid="board">
      <div class="new-bar-slot"><button type="button" data-testid="new-bar" hidden>0 new</button></div>
      <p data-testid="loader" role="status">Loading incidents…</p><p data-testid="empty" hidden>No incidents tonight.</p><ul data-testid="incident-list" class="list" hidden></ul><p id="status" role="status" aria-live="polite"></p>
    </main>
    <footer>sched-prod incident board · Refreshes every 2 seconds<br />Build <span data-testid="build-sha">BUILD_SHA</span></footer>
  </body>
</html>
